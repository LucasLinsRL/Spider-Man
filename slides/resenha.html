            </ul>

    <div class="slideshow-container">
        <div class="mySlides fade">
            <img src="imagem1.jpg" style="width:100%">
        </div>

        <div class="mySlides fade">
            <img src="imagem2.jpg" style="width:100%">
        </div>

            <img src="imagem3.jpg" style="width:100%">

        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
 
    <script src="script.js"></script>
    <br><br><br><br>
    <div id="app">
        <center><h2>Poste sua resenha do amigo da vizinhança</h2>
        <h3>Compartilhe qual seu Spider favorito (a)!</h3></center>

        <div id="review-form">
            <label for="spider-input">Nome e idade</label>
            <input type="text" id="spider-input" placeholder="Coloque seu nome e sua idade">

            <label for="variantes-input">Aranha e variante favorito(a)</label>
            <input type="text" id="variantes-input" placeholder="Nome do Aranha e Variante">

            <label for="filme-input">Filme:</label>
            <input type="text" id="filme-input" placeholder="Digite seu filme favorito">

            <label for="rating-input">Classificação (1-5) do seu filme favorito:</label>
            <input type="number" id="rating-input" min="1" max="5">

            <label for="review-input">Resenha:</label>
            <textarea id="review-input" placeholder="Escreva sua resenha (Ex: fale porque gosta de homem-aranha, suas histórias com o herói e qual suas coisas prediletas do nosso amigo da vizinhança e etc... )"></textarea>

            <button onclick="submitReview()">Enviar Resenha</button>
        </div>

        <div id="user-reviews">
            <h2>Resenhas dos Usuários</h2>
            <ul id="reviews-list"></ul>
        </div>
    </div>

    <script src="scriptresenha.js"></script>

</body>
</html>
